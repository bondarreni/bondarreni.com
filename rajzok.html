    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --ink: #1a1a1a;
        --ink-light: #6b6b6b;
        --paper: #fafaf8;
        --accent: #c8a96e;
        --border: #e8e5e0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        line-height: 1.7;
        min-height: 100vh;
      }

      /* NAV */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(250, 250, 248, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }

      .nav-links-right {
        display: flex;
        gap: 2rem;
        align-items: center;
      }

      .hamburger-menu {
        display: none;
      }

      .hamburger-menu img {
        height: 25px;
      }

      #nav-mobile {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background: rgba(250, 250, 248, 0.92);
        z-index: 1;
        width: 100%;
        flex-direction: column;
        align-items: flex-end;
      }

      #nav-mobile a {
        color: var(--ink-light);
        padding: 1rem 1.5rem;
        display: block;
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .nav-links-right {
          display: none;
        }
        .hamburger-menu {
          display: flex;
        }
      }
      @media (min-width: 769px) {
        #nav-mobile {
          display: none !important;
        }
      }

      .nav-name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.2rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-decoration: none;
        color: var(--ink);
      }

      .nav-link {
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink-light);
        transition: color 0.2s;
      }

      .nav-link:hover {
        color: var(--ink);
      }

      .section-label {
        font-size: 0.68rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 2.5rem;
      }

      .activeNavLink {
        color: var(--accent);
      }

      /* GALLERY */
      .gallery {
        border-top: 1px solid var(--border);
        padding: 8rem 2rem;
        text-align: center;
      }

      .gallery-inner {
        max-width: 1200px;
        margin: 0 auto;
      }

      .gallery h2 {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 300;
        margin-bottom: 0.5rem;
      }

      .gallery-filter {
        display: flex;
        gap: 0.4rem;
        justify-content: center;
        margin: 2.5rem 0 1.5rem;
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 0.55rem 1.5rem;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--ink-light);
        font-family: 'Inter', sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          color 0.2s;
      }

      .filter-btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .filter-btn.active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
      }

      .gallery-desc-text {
        font-size: 0.88rem;
        color: var(--ink-light);
        max-width: 52ch;
        margin: 0 auto 3rem;
        line-height: 1.85;
        min-height: 3.5em;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }

      .gallery-item {
        overflow: hidden;
        cursor: zoom-in;
        background: #f0ede8;
        aspect-ratio: 9 / 12;
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition:
          transform 0.45s ease,
          opacity 0.2s;
      }

      .gallery-item:hover img {
        transform: scale(1.05);
        opacity: 0.9;
      }

      .gallery-item.hidden {
        display: none;
      }

      /* LIGHTBOX */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(8, 8, 8, 0.93);
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .lightbox.open {
        display: flex;
      }

      .lightbox img {
        max-width: min(90vw, 640px);
        max-height: 90vh;
        object-fit: contain;
        display: block;
      }

      .lightbox-close {
        position: absolute;
        top: 1.2rem;
        right: 1.5rem;
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.55);
        font-size: 1.8rem;
        line-height: 1;
        cursor: pointer;
        padding: 0.4rem;
        transition: color 0.15s;
        font-weight: 300;
      }

      .lightbox-close:hover {
        color: #fff;
      }

      .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        padding: 1rem 1.2rem;
        transition: color 0.15s;
        line-height: 0;
        z-index: 1;
      }

      .lightbox-nav:hover {
        color: rgba(255, 255, 255, 0.95);
      }

      .lightbox-prev {
        left: 0.5rem;
      }
      .lightbox-next {
        right: 0.5rem;
      }

      #lightboxImg {
        transition: opacity 0.18s ease;
      }

      #lightboxImg.fading {
        opacity: 0;
      }

      /* FOOTER */
      footer {
        border-top: 1px solid var(--border);
        padding: 3rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        text-align: center;
      }

      .social-links {

        letter-spacing: 0.2em;

        text-decoration: none;
        color: var(--ink-light);
        transition: color 0.2s;
      }

      .social-link-light {

      .tiktok-link {

        justify-content: center;
        align-items: center;
      }

      .tiktok-logo {
        height: 25px;
        margin-right: 5px;

      .social-link:hover {
        color: var(--ink);
      }

      .footer-copy {
        font-size: 0.72rem;
        color: #c0c0c0;
      }

      /* RESPONSIVE */

        footer {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }

        .gallery-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 3px;
        }
      }
    </style>

    <script>
      let turnstileToken = null
      let turnstileWidgetId = null
      let pendingSubmit = false

      function onloadTurnstileCallback() {
        const container = document.getElementById('turnstileWidget')
        if (container) {
          turnstileWidgetId = turnstile.render(container, {
            sitekey: '0x4AAAAAADjl8zPCcTc3eqv7',
            theme: 'light',
            size: 'normal',
            appearance: 'execute',
            callback: function (token) {
              turnstileToken = token
              if (pendingSubmit) {
                pendingSubmit = false
                localStorage.removeItem('timestamp')
                document.getElementById('signupForm').dispatchEvent(new Event('submit'))
              }
            },
            'expired-callback': function () {
              turnstileToken = null
              pendingSubmit = false
            },
            'error-callback': function () {
              turnstileToken = null
              pendingSubmit = false
            }
          })
        }
      }

      function checkClickOutLimit({ errorMessageText, inputs, submitButton, backButton }) {
        const timestamp = Date.now()
        const previousTimestamp = localStorage.getItem('timestamp')
        if (previousTimestamp && Number(previousTimestamp) + 5000 > timestamp) {
          document.getElementById('captchaContainer').style.display = 'none'
          errorMessageText.innerText = 'Túl sok kísérlet, kérlek próbáld újra egy kis idő múlva.'
          inputs.forEach((input) => {
            if (input) input.style.display = 'none'
          })
          submitButton.style.display = 'none'
          errorMessageText.style.display = 'block'
          backButton.style.display = 'block'
          return true
        }
      }

      // GALLERY FILTER
      const galleryDescs = {
        all: 'Emlékek megőrzése rajz formában. Minden illusztráció egyedileg, kézzel készül, szeretettel. 🤍',
        plush:
          'A plüss rajzaimmal segítek megőrizni egy különleges korszak emlékeit - azt az időszakot, amikor a gyerekek mindenhová magukkal viszik a kis barátjukat.',
        pets: 'A háziállat családtag. Portéimmal a hozzájuk kötődő emlékeket és történeteket őrzöm meg.'
      }

      document.querySelectorAll('.filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'))
          btn.classList.add('active')
          const filter = btn.dataset.filter
          document.getElementById('galleryDesc').textContent = galleryDescs[filter]
          document.querySelectorAll('.gallery-item').forEach((item) => {
            item.classList.toggle('hidden', filter !== 'all' && item.dataset.category !== filter)
          })
        })
      })

      // LIGHTBOX (gallery)
      const lightbox = document.getElementById('lightbox')
      const lightboxImg = document.getElementById('lightboxImg')
      let lbItems = []
      let lbIndex = 0
      let touchStartX = 0

      function getVisibleImgs() {
        return Array.from(document.querySelectorAll('.gallery-item:not(.hidden) img'))
      }

      function showLightboxImg(img) {
        lightboxImg.classList.add('fading')
        setTimeout(() => {
          lightboxImg.src = img.src
          lightboxImg.alt = img.alt
          lightboxImg.classList.remove('fading')
        }, 160)
      }

      function lbNavigate(dir) {
        lbIndex = (lbIndex + dir + lbItems.length) % lbItems.length
        showLightboxImg(lbItems[lbIndex])
      }

      function openLightbox(img) {
        lbItems = getVisibleImgs()
        lbIndex = lbItems.indexOf(img)
        lightboxImg.src = img.src
        lightboxImg.alt = img.alt
        lightbox.classList.add('open')
        document.body.style.overflow = 'hidden'
      }

      function closeLightbox() {
        lightbox.classList.remove('open')
        document.body.style.overflow = ''
      }

      document.querySelectorAll('.gallery-item img').forEach((img) => {
        img.addEventListener('click', () => openLightbox(img))
      })

      document.getElementById('lightboxClose').addEventListener('click', closeLightbox)
      document.getElementById('lightboxPrev').addEventListener('click', (e) => {
        e.stopPropagation()
        lbNavigate(-1)
      })
      document.getElementById('lightboxNext').addEventListener('click', (e) => {
        e.stopPropagation()
        lbNavigate(1)
      })

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox()
      })

      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('open')) return
        if (e.key === 'Escape') closeLightbox()
        if (e.key === 'ArrowLeft') lbNavigate(-1)
        if (e.key === 'ArrowRight') lbNavigate(1)
      })

      lightbox.addEventListener(
        'touchstart',
        (e) => {
          touchStartX = e.touches[0].clientX
        },
        { passive: true }
      )
      lightbox.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - touchStartX
        if (Math.abs(dx) > 40) lbNavigate(dx < 0 ? 1 : -1)
      })

      function showHamburger() {
        const navLinks = document.getElementById('nav-mobile')
        if (navLinks.style.display === 'flex') {
          navLinks.style.display = 'none'
        } else {
          navLinks.style.display = 'flex'
        }
      }
    </script>
